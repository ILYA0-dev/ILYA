name: Build media

# Runs automatically whenever a source video is added or replaced in
# img/source/. It regenerates the lo/hi variants + poster frames
# (audio always stripped) and commits the result — no manual ffmpeg
# step needed.

on:
  push:
    paths:
      - "img/source/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build media variants
        run: node scripts/build-media.js

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/*.mp4 img/*.jpg
          git diff --cached --quiet || git commit -m "chore: auto-build media (lo/hi, no audio) [skip ci]"
          git push
